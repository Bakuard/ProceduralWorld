<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Generated World</title>
	<link rel="stylesheet" type="text/css" href="css/index.css">
	<script type="module" src="js/index.js"></script>
</head>
<body>
	<main class="game">
		<div class="game-canvas-container"></div>

		<section class="game-hud">
			<div class="energy-bar">
				<div class="energy-bar-available-energy"></div>
				<div class="energy-bar-tiredness"></div>
				<div class="energy-bar-damaged"></div>
			</div>
		</section>

		<div class="game-modal-overlay hidden" id="game-over">
			<div class="game-modal">
				<h2 class="game-modal-title">Игра окончена</h2>
				<button class="game-modal-btn" type="button">Заново</button>
			</div>
		</div>

		<div class="game-modal-overlay hidden" id="game-pause">
			<div class="game-modal">
				<h2 class="game-modal-title">Пауза</h2>
				<button class="game-modal-btn" type="button">Продолжить</button>
			</div>
		</div>
	</main>
</body>
</html>
