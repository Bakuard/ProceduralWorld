<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Generated World</title>
	<link rel="stylesheet" type="text/css" href="css/index.css">
	<script type="module" src="js/index.js"></script>
</head>
<body>
	<main class="game">
		<section class="game-canvas-container"></section>
		<section class="game-hud">
			<div class="energy-bar">
				<div class="energy-bar-available-energy"></div>
				<div class="energy-bar-tiredness"></div>
				<div class="energy-bar-damaged"></div>
			</div>
		</section>
		<section class="game-over-overlay hidden">
			<div class="game-over-modal">
				<h2 class="game-over-title">Игра окончена</h2>
				<button class="game-over-restart-btn" type="button">Заново</button>
			</div>
		</section>
	</main>
</body>
</html>
